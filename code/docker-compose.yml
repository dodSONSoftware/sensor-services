services:
  sensor-services:
    build: .
    container_name: sensor-services
    ports:
      - "32000:32000"
    volumes:
      - /mnt/sensor-services/:/app/configs/
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:32000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
