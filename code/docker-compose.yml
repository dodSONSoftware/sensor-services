services:
  sensor-services:
    build: .
    container_name: sensor-services
    ports:
      - "32000:32000"
    volumes:
      - /mnt/sensor-services/:/app/configs/
    # Gates POST /restart-service (token-gated graceful self-restart). An unset
    # host variable arrives in the container as an EMPTY value — the real
    # deployed "disabled" state (the endpoint answers 503; the service runs
    # normally). See .env.example for generation (openssl rand -hex 32).
    environment:
      - RESTART_SERVICE_TOKEN=${RESTART_SERVICE_TOKEN:-}
    restart: unless-stopped
    # Must exceed the application's hard shutdown timeout (HARD_SHUTDOWN_TIMEOUT_MS,
    # src/common/shutdown.ts) or Docker's SIGKILL lands mid-shutdown. Pinned by
    # tests/__tests__/docker/docker.test.ts.
    stop_grace_period: 20s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:32000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
