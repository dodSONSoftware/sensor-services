# Sensor Web Services configuration

# Main HTTP server port
express-port: 32000

# Logging (debug, error, warn, info)
log-level: debug

# Optional: Loki structured logging
loki-url: "http://10.10.10.60:3100"
loki-enabled: false

# MQTT broker connection
mqtt-broker-ip-address: "10.10.10.64"
mqtt-topic-telemetry: "iot/telemetry"
mqtt-topic-command: "iot/v2/command"
mqtt-topic-command-response: "iot/v2/command-response"

# External services
ip-pinger-web-api: "http://10.10.10.50:3300"

# Behavior
case-sensitive: true

# Optional: override auto-derived Swagger server URL
# swagger-server-url: "http://10.10.10.217:32000/"

# Optional: disable forwarding of sensor application logs to the app logger (default: true)
# forward-sensor-logs: false
# Minimum log level for forwarded sensor logs (default: debug = forward everything)
# (debug, error, warn, info)
# forward-sensor-logs-level: info

# Optional: Express JSON body size limit (default: 1mb)
#express-body-limit: "1mb"

# Optional: Prometheus source label sanitization
sensor-source-max-length: 30
sensor-source-valid-chars-regex: "a-zA-Z0-9._-"

# Optional: Rate limiting (applied to all routes)
rate-limit-window-ms: 600000    # 10 minutes in milliseconds
rate-limit-max: 250             # max requests per window

# Optional: silence timeout for sensor command responses (default: 1500ms)
command-silence-timeout-ms: 5000

# PostgreSQL database for settings persistence
db-host: "10.10.10.64"
db-port: 5432
db-name: "sensor_web_services"
db-user: "appuser"
db-password: "password"
