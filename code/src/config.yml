# SensorNET Services configuration
# This file is the single source of truth for all application configuration,
# including credentials (db-password, loki-url).

# Main HTTP server port
express-port: 32000

# Logging (debug, error, warn, info)
log-level: debug

# Optional: Loki structured logging
loki-url: "http://10.10.10.60:3100"
loki-enabled: true

# MQTT broker connection
mqtt-broker-ip-address: "10.10.10.64"
mqtt-topic-command: "iot/v3/command"
mqtt-topic-command-response: "iot/v3/command-response"

# External services
ip-pinger-web-api: "http://10.10.10.50:3300"
sensor-telemetry-api: "http://10.10.10.50:3301"

# Behavior
case-sensitive: true

# Optional: override auto-derived Swagger server URL
# swagger-server-url: "http://10.10.10.217:32000/"

# Optional: sensor application log topic (default: iot/v3/log)
# mqtt-topic-log: "iot/v3/log"

# Optional: disable forwarding of sensor application logs to the app logger (default: true)
# forward-sensor-logs: false
# Minimum log level for forwarded sensor logs (default: debug = forward everything)
# (debug, error, warn, info)
# forward-sensor-logs-level: info

# Optional: Express JSON body size limit (default: 1mb)
#express-body-limit: "1mb"

# Optional: Prometheus source label sanitization
sensor-source-max-length: 30
sensor-source-valid-chars-regex: "a-zA-Z0-9._-"

# Optional: Rate limiting (applied to all routes)
rate-limit-window-ms: 600000    # 10 minutes in milliseconds
rate-limit-max: 250             # max requests per window

# Optional: CORS allowed origins (browser UIs only). Each entry must be an
# http(s) origin of the form scheme://host[:port] (no path/credentials). When
# this key is absent, NO cross-origin browser origin is authorized (secure
# default) — non-browser clients (no Origin header) are unaffected. Set the
# web UI origin(s) here to allow the browser app to call this API cross-origin:
# cors-allowed-origins:
#   - "http://10.10.10.7:4200"
#   - "https://sensors.example.com"

# Optional: silence timeout for sensor command responses (default: 1500ms)
command-silence-timeout-ms: 5000

# Optional: fetch timeout for the IP pinger proxy/analyze calls (default: 10000ms).
# The older key name fetch-timeout-ms is still accepted as a deprecated alias;
# if both are set, ippinger-fetch-timeout-ms wins.
# ippinger-fetch-timeout-ms: 10000

# PostgreSQL database for settings persistence
db-host: "10.10.10.64"
db-port: 5432
db-name: "sensor_web_services"
db-user: "appuser"
db-password: "password"
