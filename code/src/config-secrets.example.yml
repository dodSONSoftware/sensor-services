# SensorNET Services — secret configuration (TEMPLATE)
#
# Copy this file to `config-secrets.yml` (in the SAME directory as config.yml)
# and fill in the real values:
#
#     cp config-secrets.example.yml config-secrets.yml
#
# `config-secrets.yml` is gitignored and must NEVER be committed or baked into a
# Docker image. Keys defined in it override the same keys in config.yml, which
# is how the base config stays free of real credentials. If a required secret
# (e.g. db-password) is missing from the merged config, validation fails at
# startup with a clear error.
#
# This file is the only tracked reference to secret keys — it contains
# placeholders only, no real credentials.
